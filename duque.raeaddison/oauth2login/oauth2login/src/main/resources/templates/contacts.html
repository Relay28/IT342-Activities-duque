<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Contacts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="card p-4">
  <h2 class="mb-3">User Details</h2>
  <p><strong>Name:</strong> <span th:text="${userName}"></span></p>
  <p><strong>Email:</strong> <span th:text="${userEmail}"></span></p>

</div>

<div class="mt-4">
  <h3>User Contacts</h3>
  <table class="table table-bordered mt-3">
    <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Phone Number</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="contact : ${contacts}">
      <td th:text="${contact.name}"></td>
      <td th:text="${contact.email}"></td>
      <td th:text="${contact.phoneNumber}"></td>
    </tr>
    </tbody>
  </table>

  <a href="http://localhost:8080/logout"><button>Logout</button></a>
</div>
</body>
</html>
