<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Contacts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">
<div class="container">

      <!-- Flash Messages -->
      <!-- Success Message-->
      <div th:if="${successMessage}" class="alert alert-success text-center" role="alert">
        <span th:text="${successMessage}"></span>
      </div>
      <!-- Error Message -->
      <div th:if="${error}" class="alert alert-danger text-center" role="alert">
        <span th:text="${error}"></span>
      </div>

      <!-- Logout Button -->
      <div class="d-flex justify-content-end mb-3">
        <a href="/logout" class="btn btn-secondary">Logout</a>
      </div>

  <!-- User Info Card -->
        <div class="card shadow-lg p-4 mb-4">
          <h2 class="mb-3 text-primary">Google Contacts</h2>

            <div class="mb-2">
                <span class="fw-bold">Name:</span>
                <span th:text="${userinfo.name}" class="ms-2"></span>
            </div>

            <div class="mb-2">
                <span class="fw-bold">Email:</span>
                <span th:text="${userinfo.email}" class="ms-2"></span>
            </div>

            <!-- Add Contact Button -->
          <a href="/add-contact" class="btn btn-primary mt-3">+ Add New Contact</a>
        </div>

      <!-- Contacts Table -->
      <div class="card shadow-sm p-4">
        <h3 class="mb-3">Contacts List</h3>
        <table class="table table-hover align-middle">
          <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th class="text-center">Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="contact : ${contacts}">
              <!-- Name Display -->
              <td>
                <span th:if="${contact.names != null && !contact.names.isEmpty()}" th:text="${contact.names[0].displayName}"></span>
                <span th:unless="${contact.names != null && !contact.names.isEmpty()}">No name</span>
              </td>
              <!-- Email Address Display -->
              <td>
                <th:block th:if="${contact.emailAddresses != null && !contact.emailAddresses.isEmpty()}">
                  <span th:each="email : ${contact.emailAddresses}">
                    <span th:text="${email.value}"></span><br>
                  </span>
                </th:block>
                <span th:unless="${contact.emailAddresses != null && !contact.emailAddresses.isEmpty()}">No email</span>
              </td>

              <!-- Phone Number Display -->
              <td>
                <th:block th:if="${contact.phoneNumbers != null && !contact.phoneNumbers.isEmpty()}">
                  <span th:each="phone : ${contact.phoneNumbers}">
                    <span th:text="${phone.value}"></span><br>
                  </span>
                </th:block>
                <span th:unless="${contact.phoneNumbers != null && !contact.phoneNumbers.isEmpty()}">No phone</span>
              </td>


              <!-- Edit Button traverses to editcontact.html while passing resource name of the contact -->
              <td class="text-center">
                <a th:href="@{/edit-contact(resourceName=${contact.resourceName})}" class="btn btn-sm btn-warning me-2">Edit</a>
                <!-- Delete Button Triggers Modal -->
                <button type="button" class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal"
                        th:attr="data-resource=${contact.resourceName}, data-name=${contact.names[0].displayName}">Delete</button>
              </td>

            </tr>

            <tr th:if="${contacts.isEmpty()}">
              <td colspan="4" class="text-center text-muted">No contacts found</td>
            </tr>

          </tbody>
        </table>
      </div>

    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">

          <!-- Cancel On the top right -->
          <div class="modal-header">
            <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            Are you sure you want to delete <strong id="contactName"></strong>?
          </div>

          <div class="modal-footer">
            <!-- Cancel Button -->
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <!-- Delete button which calls the Endpoint for Deleting a contact-->
            <form id="deleteForm" method="post" th:action="@{/api/contacts/delete}">
              <input type="hidden" name="resourceName" id="resourceName">
              <button type="submit" class="btn btn-danger">Delete</button>
            </form>
          </div>

        </div>
      </div>
    </div>

<!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var deleteModal = document.getElementById("deleteModal");

      deleteModal.addEventListener("show.bs.modal", function (event) {
        var button = event.relatedTarget;
        var resourceName = button.getAttribute("data-resource");
        var contactName = button.getAttribute("data-name");

        document.getElementById("resourceName").value = resourceName;
        document.getElementById("contactName").textContent = contactName;
      });
    });
  </script>

</body>
</html>
