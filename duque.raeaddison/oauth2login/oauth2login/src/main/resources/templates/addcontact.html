<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-4">
                <h2 class="text-center mb-4">Add Contact</h2>
                <form action="/api/contacts/add" method="post">
                    <div class="mb-3">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" name="firstName" required>
                    </div>
                    <div class="mb-3">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" name="lastName" required>
                    </div>

                    <!-- Email fields -->
                    <div class="mb-3" id="emailFields">
                        <label class="form-label">Email Addresses</label>
                        <div class="input-group">
                            <input type="email" class="form-control" name="emails" placeholder="Email">
                            <button type="button" class="btn btn-outline-secondary" onclick="addEmailField()">+</button>
                        </div>
                    </div>

                    <!-- Phone number fields -->
                    <div class="mb-3" id="phoneFields">
                        <label class="form-label">Phone Numbers</label>
                        <div class="input-group">
                            <input type="tel" class="form-control" name="phoneNumbers" placeholder="Phone Number">
                            <button type="button" class="btn btn-outline-secondary" onclick="addPhoneField()">+</button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-3">
                        <a href="contacts" class="btn btn-outline-secondary flex-grow-1 me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary flex-grow-1">Add Contact</button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<script>
    function addEmailField() {
        const container = document.getElementById('emailFields');
        const div = document.createElement('div');
        div.className = 'input-group mt-2';
        div.innerHTML = `
            <input type="email" class="form-control" name="emails" placeholder="Email">
            <button type="button" class="btn btn-outline-danger" onclick="this.parentElement.remove()">-</button>
        `;
        container.appendChild(div);
    }

    function addPhoneField() {
        const container = document.getElementById('phoneFields');
        const div = document.createElement('div');
        div.className = 'input-group mt-2';
        div.innerHTML = `
            <input type="tel" class="form-control" name="phoneNumbers" placeholder="Phone Number">
            <button type="button" class="btn btn-outline-danger" onclick="this.parentElement.remove()">-</button>
        `;
        container.appendChild(div);
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
